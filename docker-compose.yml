# =================================================================
# AI Opportunity Radar — local development stack (MVP)
# =================================================================
# Services:
#   postgres    primary database
#   redis       cache / dedup
#   backend     FastAPI (uvicorn) — http://localhost:8000
#   n8n         workflow orchestrator — http://localhost:5678
#
# Removed in MVP (simplify §6):
#   * worker    — daily cron runs in n8n, not a Python worker
#   * frontend  — moved to experimental/frontend/
# =================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-run bootstrap: create secondary databases (n8n, etc.) so the
      # sibling containers have somewhere to land. Runs once when pgdata is
      # empty; subsequent boots reuse the data directory and skip it.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: radar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside docker, hostnames are service names not localhost.
      DATABASE_URL: postgresql+asyncpg://radar:radar@postgres:5432/radar
      DATABASE_URL_SYNC: postgresql://radar:radar@postgres:5432/radar
      REDIS_URL: redis://redis:6379/0
      REDIS_RESULT_BACKEND: redis://redis:6379/1
    # Use real upstream DNS so the SSRF guard (which blocks private IPs)
    # works on public hostnames. Some local proxies intercept DNS via
    # fake-IP mode and return 198.18.0.0/15 — that's the proxy's normal
    # range and would otherwise trigger the SSRF block on every URL.
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - ./backend:/app
      # n8n/workflows/* needs to be visible to the backend too — the
      # n8n_sync script reads them when pushing into the n8n container.
      - ./n8n/workflows:/n8n/workflows:ro
    ports:
      - "8000:8000"
    # Phase 29 fix — `--reload` was the root cause of "bot's /run
    # submitted but post-back never fired". ``asyncio.create_task`` lives
    # in the uvicorn worker process; a worker restart (any .py file
    # change in ./backend, *including* pytest runs that touch
    # tests/*.py) terminates the in-flight ``_execute_pipeline`` task
    # mid-run, leaving the user with a "submitted" reply but no
    # follow-up card. Use `docker compose restart backend` to apply
    # code changes instead — the trade-off is a few seconds of downtime
    # for guaranteed /run completion.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/api/health').status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:1
    container_name: radar-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: radar
      DB_POSTGRESDB_PASSWORD: radar
      # Owner credentials are seeded via direct DB write (the n8n setup wizard
      # is disabled by SKIP_OWNER_SETUP). User management stays ENABLED so
      # n8n presents the email/password login form — basic auth at the HTTP
      # layer in 1.x does NOT actually enforce (verified empirically: every
      # request returns 200 even with wrong creds). The owner row in the
      # `user` table is what gates access.
      N8N_BASIC_AUTH_ACTIVE: "false"
      N8N_SKIP_OWNER_SETUP: "true"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      # Variables consumed by the workflow JSON in /n8n/workflows/*.json.
      # Every HTTP Request node references these via `={{$env.NAME}}`.
      API_BASE_URL_INTERNAL: http://backend:8000
      RADAR_WEBHOOK_SECRET: ${RADAR_WEBHOOK_SECRET:-dev-secret-change-me}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/tmp/workflows
    ports:
      - "5678:5678"

volumes:
  pgdata:
  redisdata:
  n8ndata: